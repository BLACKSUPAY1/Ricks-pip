<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiskPip - Paso 2</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf7; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  .sub { color: #8aa0bd; font-size: 14px; margin-bottom: 16px; }
  #estado { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: #1a2438; display: inline-block; margin-bottom: 16px; }
  #estado.ok { background: #12351f; color: #5eea8a; }
  #estado.mal { background: #3a1616; color: #ff8a8a; }
  select, input, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #2a3a57; background: #121b2e; color: #e6edf7; margin-bottom: 10px; }
  button { background: #2563eb; border-color: #2563eb; font-weight: 600; cursor: pointer; }
  button.sec { background: #121b2e; border-color: #2a3a57; font-weight: 500; }
  #precio { font-size: 40px; font-weight: 700; margin-bottom: 4px; }
  #moneda { color: #8aa0bd; margin-bottom: 8px; }
  #mensaje { font-size: 14px; min-height: 20px; color: #ffcf6b; margin-bottom: 6px; }
  #aviso { display: none; padding: 14px; border-radius: 10px; background: #12351f; color: #5eea8a; font-weight: 600; margin-bottom: 16px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-bottom: 1px solid #1f2c45; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
  li .info small { display: block; color: #8aa0bd; font-size: 12px; margin-top: 2px; }
  li.hecha { opacity: .6; }
  li button { width: auto; padding: 6px 12px; margin: 0; font-size: 14px; background: #3a1616; border-color: #5a2222; font-weight: 500; }
  .vacio { color: #8aa0bd; font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>
  <h1>RiskPip · Paso 2</h1>
  <div class="sub">Alertas de precio con Binance</div>

  <div id="estado">Conectando…</div>
  <div id="aviso"></div>

  <select id="selector">
    <option value="BTCUSDT">BTC / USDT</option>
    <option value="ETHUSDT">ETH / USDT</option>
    <option value="SOLUSDT">SOL / USDT</option>
    <option value="BNBUSDT">BNB / USDT</option>
  </select>

  <div id="precio">—</div>
  <div id="moneda">BTC / USDT</div>

  <h2>Nueva alerta</h2>
  <select id="condicion">
    <option value="sube">Avisar cuando SUBA a…</option>
    <option value="baja">Avisar cuando BAJE a…</option>
  </select>
  <input id="objetivo" type="number" inputmode="decimal" step="any" placeholder="Precio objetivo">
  <div id="mensaje"></div>
  <button id="crear">Crear alerta</button>
  <button id="permiso" class="sec">Activar avisos del teléfono</button>

  <h2>Mis alertas</h2>
  <ul id="lista"></ul>

<script>
  var PARES = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT"];
  var NOMBRES = { BTCUSDT: "BTC / USDT", ETHUSDT: "ETH / USDT", SOLUSDT: "SOL / USDT", BNBUSDT: "BNB / USDT" };
  var CLAVE = "riskpip_alertas";

  var elEstado = document.getElementById("estado");
  var elAviso = document.getElementById("aviso");
  var elSelector = document.getElementById("selector");
  var elPrecio = document.getElementById("precio");
  var elMoneda = document.getElementById("moneda");
  var elCondicion = document.getElementById("condicion");
  var elObjetivo = document.getElementById("objetivo");
  var elMensaje = document.getElementById("mensaje");
  var elLista = document.getElementById("lista");

  var precios = {};
  var alertas = cargar();
  var socket = null;
  var reintento = null;
  var audio = null;

  function cargar() {
    try { return JSON.parse(localStorage.getItem(CLAVE) || "[]"); } catch (e) { return []; }
  }
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(alertas)); } catch (e) {}
  }
  function formatear(n) {
    return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 6 });
  }

  /* ---------- Avisos ---------- */
  function sonar() {
    try {
      if (!audio) { audio = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audio.state === "suspended") { audio.resume(); }
      var osc = audio.createOscillator();
      var gan = audio.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gan.gain.value = 0.2;
      osc.connect(gan);
      gan.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.6);
    } catch (e) {}
  }

  function avisar(texto) {
    elAviso.textContent = texto;
    elAviso.style.display = "block";
    sonar();
    try { if (navigator.vibrate) { navigator.vibrate([300, 150, 300]); } } catch (e) {}
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("RiskPip", { body: texto });
      }
    } catch (e) {}
  }

  document.getElementById("permiso").addEventListener("click", function () {
    sonar();
    if (!("Notification" in window)) {
      elMensaje.textContent = "Este navegador no permite avisos. Verás el aviso dentro de la página.";
      return;
    }
    Notification.requestPermission().then(function (r) {
      elMensaje.textContent = r === "granted"
        ? "Avisos del teléfono activados."
        : "No se activaron los avisos. Verás el aviso dentro de la página.";
    });
  });

  /* ---------- Alertas ---------- */
  function revisar(par, precio) {
    var cambio = false;
    alertas.forEach(function (a) {
      if (!a.activa || a.par !== par) { return; }
      var cumple = (a.condicion === "sube" && precio >= a.objetivo) ||
                   (a.condicion === "baja" && precio <= a.objetivo);
      if (cumple) {
        a.activa = false;
        a.hora = new Date().toLocaleTimeString("es-DO");
        cambio = true;
        avisar(NOMBRES[par] + " llegó a " + formatear(precio) + " (alerta: " + formatear(a.objetivo) + ")");
      }
    });
    if (cambio) { guardar(); dibujar(); }
  }

  document.getElementById("crear").addEventListener("click", function () {
    sonar();
    var par = elSelector.value;
    var objetivo = parseFloat(elObjetivo.value);
    var condicion = elCondicion.value;
    var actual = precios[par];
    elMensaje.textContent = "";

    if (!isFinite(objetivo) || objetivo <= 0) {
      elMensaje.textContent = "Escribe un precio objetivo válido.";
      return;
    }
    if (actual === undefined) {
      elMensaje.textContent = "Espera a que cargue el precio actual.";
      return;
    }
    if ((condicion === "sube" && actual >= objetivo) || (condicion === "baja" && actual <= objetivo)) {
      elMensaje.textContent = "El precio actual (" + formatear(actual) + ") ya cumple esa condición. Elige otro precio.";
      return;
    }
    alertas.push({ id: Date.now(), par: par, condicion: condicion, objetivo: objetivo, activa: true, hora: "" });
    guardar();
    elObjetivo.value = "";
    dibujar();
  });

  function dibujar() {
    elLista.innerHTML = "";
    if (alertas.length === 0) {
      var vacio = document.createElement("div");
      vacio.className = "vacio";
      vacio.textContent = "Todavía no tienes alertas.";
      elLista.appendChild(vacio);
      return;
    }
    alertas.slice().reverse().forEach(function (a) {
      var li = document.createElement("li");
      if (!a.activa) { li.className = "hecha"; }

      var info = document.createElement("div");
      info.className = "info";
      var linea = document.createElement("div");
      linea.textContent = NOMBRES[a.par] + " " + (a.condicion === "sube" ? "sube a " : "baja a ") + formatear(a.objetivo);
      var estado = document.createElement("small");
      estado.textContent = a.activa ? "Activa" : "Se cumplió a las " + a.hora;
      info.appendChild(linea);
      info.appendChild(estado);

      var borrar = document.createElement("button");
      borrar.textContent = "Borrar";
      borrar.addEventListener("click", function () {
        alertas = alertas.filter(function (x) { return x.id !== a.id; });
        guardar();
        dibujar();
      });

      li.appendChild(info);
      li.appendChild(borrar);
      elLista.appendChild(li);
    });
  }

  /* ---------- Conexión a Binance ---------- */
  function mostrarSeleccionado() {
    var par = elSelector.value;
    elMoneda.textContent = NOMBRES[par];
    elPrecio.textContent = precios[par] !== undefined ? formatear(precios[par]) : "—";
  }

  function conectar() {
    clearTimeout(reintento);
    if (socket) { socket.onclose = null; socket.close(); }

    elEstado.textContent = "Conectando…";
    elEstado.className = "";

    var flujos = PARES.map(function (p) { return p.toLowerCase() + "@trade"; }).join("/");
    socket = new WebSocket("wss://stream.binance.com:9443/stream?streams=" + flujos);

    socket.onopen = function () {
      elEstado.textContent = "Conectado a Binance";
      elEstado.className = "ok";
    };

    socket.onmessage = function (evento) {
      var msg = JSON.parse(evento.data);
      var d = msg.data;
      if (!d || !d.s) { return; }
      var precio = parseFloat(d.p);
      precios[d.s] = precio;
      if (d.s === elSelector.value) { elPrecio.textContent = formatear(precio); }
      revisar(d.s, precio);
    };

    socket.onerror = function () {
      elEstado.textContent = "Error de conexión (puede ser bloqueo por región o internet)";
      elEstado.className = "mal";
    };

    socket.onclose = function () {
      elEstado.textContent = "Desconectado, reintentando…";
      elEstado.className = "mal";
      reintento = setTimeout(conectar, 3000);
    };
  }

  elSelector.addEventListener("change", mostrarSeleccionado);
  elAviso.addEventListener("click", function () { elAviso.style.display = "none"; });

  dibujar();
  conectar();
</script>
</body>
</html>
